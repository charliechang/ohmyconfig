# Fallback split navigation for Ghostty (macOS), same keys as Windows Terminal
# (terminal/windows-terminal-nav.json). C-h/j/k/l already crosses splits via
# tmux/nav.sh; these work even when that path can't (e.g. a remote without
# this config). Ghostty's own default is also there: cmd+opt+arrows.
# Include from ~/.config/ghostty/config:
#   config-file = ~/work/ohmyconfig/terminal/ghostty-nav.conf
# Design + progress: docs/terminal-split-nav.md
keybind = ctrl+alt+h=goto_split:left
keybind = ctrl+alt+j=goto_split:down
keybind = ctrl+alt+k=goto_split:up
keybind = ctrl+alt+l=goto_split:right
