set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Sixel image support. Requires a Sixel-built tmux (conda-forge 3.7b via the
# ~/.local/bin/tmux wrapper) and a Sixel-capable terminal (Windows Terminal
# >= 1.22). Powers Neovim's <leader>mm mermaid PNG popups.
set -ag terminal-features ",*:sixel"

setw -g mode-keys vi
# set-option -g default-command "reattach-to-user-namespace -l /bin/zsh"
set-option -g default-command "/usr/bin/zsh"
set-option -g allow-rename off
set-option -g default-terminal "screen-256color"

#bind -n C-s run-shell "tmux show-buffer | reattach-to-user-namespace  pbcopy"
#bind -T prefix ] run-shell "tmux set-buffer \"$(reattach-to-user-namespace pbpaste)\"; tmux paste-buffer"
#unbind -T copy-mode-vi Enter
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel # \; run-shell "tmux show-buffer | clip.exe"
unbind -T copy-mode-vi v
bind -T copy-mode-vi v send-keys -X begin-selection
set -sg escape-time 20

bind -T prefix | split-window -h
bind -T prefix - split-window -v

#set -g pane-border-style fg=magenta
#set -g pane-active-border-style fg=magenta
#set -g pane-active-border-style bg=default

#set -g window-style 'fg=colour46,bg=colour235'
#set -g window-style 'fg=black,bg=#abccaf'
#set -g window-active-style 'fg=colour46,bg=black'
#set -g window-active-style 'fg=black,bg=#c7edcc'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
#bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
# bind-key -T copy-mode-vi C-\ select-pane -l
set -g allow-passthrough on

# #### herdr-style agent status ####
# Claude Code hooks (installed by tmux/install-agent-state.sh) tag each pane with
# @agent_state = working | blocked | done | idle; see tmux/agent-state.sh.
# Window badge = most urgent pane state: ! blocked, ✓ done, ● working, · idle.
# Badges carry their own bg so they stand out on the default green status bar.
set -g focus-events on
set -g status-interval 2
set -g @agent_badge '#{?#{m:*blocked*,#{P:#{@agent_state} }}, #[fg=white]#[bg=red]#[bold] ! #[default],#{?#{m:*done*,#{P:#{@agent_state} }}, #[fg=white]#[bg=colour25]#[bold] ✓ #[default],#{?#{m:*working*,#{P:#{@agent_state} }}, #[fg=black]#[bg=colour220] ● #[default],#{?#{m:*idle*,#{P:#{@agent_state} }}, #[fg=colour238]·#[default],}}}}'
set -g window-status-format         '#I:#W#{?window_flags,#{window_flags}, }#{E:@agent_badge}'
set -g window-status-current-format '#I:#W#{?window_flags,#{window_flags}, }#{E:@agent_badge}'
set -g status-right-length 60
set -g status-right '#(~/.local/bin/tmux-agent-state summary)"#{=21:pane_title}" %H:%M %d-%b-%y'
# Looking at a done pane marks it seen (idle).
set-hook -g pane-focus-in          'run-shell -b "~/.local/bin/tmux-agent-state seen #{pane_id}"'
set-hook -g session-window-changed 'run-shell -b "~/.local/bin/tmux-agent-state seen #{pane_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/tmux-agent-state seen #{pane_id}"'
# prefix a: jump to next agent needing attention (blocked, then done).
# prefix A: pick from all windows running an agent.
bind -T prefix a run-shell -b "~/.local/bin/tmux-agent-state next '#{client_name}'"
bind -T prefix A choose-tree -Zw -f '#{m:*[a-z]*,#{P:#{@agent_state}}}'
